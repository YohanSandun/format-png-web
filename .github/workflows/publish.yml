# Stages the format-png package on npm when a version tag is pushed:
#
#   git tag -a v0.1.3 -m "format-png 0.1.3" && git push origin v0.1.3
#
# The tag must match the version in packages/format-png/package.json. A
# prerelease version, such as 0.2.0-beta.1, goes under the `next` dist-tag, so
# `npm install format-png` keeps getting the latest stable one.
#
# Uses npm trusted publishing with staged publishing: no npm token is stored
# here, and the version isn't live until a maintainer approves it with 2FA, on
# npmjs.com or with `npm stage approve <stage-id>`.
#
# Run it by hand from the Actions tab to do everything except stage it: a dry run.

name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job request the identity token that trusted publishing uses.
      id-token: write
    defaults:
      run:
        working-directory: format-png-web

    steps:
      - name: Check out format-png-web
        uses: actions/checkout@v5
        with:
          path: format-png-web

      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./packages/format-png/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version}; expected v${version}."
            exit 1
          fi

      # Trusted publishing needs Node 22.14 or later.
      - uses: ./format-png-web/.github/actions/setup
        with:
          node-version: '22'

      # `npm stage` needs npm 11.15.0 or later, newer than the one Node 22 ships with.
      - name: Update npm
        run: |
          npm install -g "npm@^11.15.0"
          npm --version

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Test the packed package
        run: npm run test:package -w format-png

      # Build and tests already ran above, so prepublishOnly is skipped with
      # --ignore-scripts rather than run a second time.
      - name: Stage
        working-directory: format-png-web/packages/format-png
        run: |
          version=$(node -p "require('./package.json').version")
          dist_tag=latest
          case "$version" in *-*) dist_tag=next ;; esac

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            npm stage publish --ignore-scripts --provenance --access public --tag "$dist_tag"
            {
              echo "### format-png@${version} is staged"
              echo
              echo "It isn't live until a maintainer approves it with 2FA: on"
              echo "[npmjs.com](https://www.npmjs.com/package/format-png), or with"
              echo "\`npm stage approve <stage-id>\`. It will be published under the \`${dist_tag}\` dist-tag."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Not a tag: dry run of format-png@${version} with dist-tag ${dist_tag}."
            npm stage publish --ignore-scripts --dry-run --tag "$dist_tag"
          fi
