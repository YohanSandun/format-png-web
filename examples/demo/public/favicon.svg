<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#6d28d9"/>
  <!-- A 4×4 grid of pixels, some transparent, as a nod to what's inside a PNG. -->
  <g fill="#fff">
    <rect x="6" y="6" width="5" height="5" rx="1"/>
    <rect x="11" y="6" width="5" height="5" rx="1" fill-opacity=".55"/>
    <rect x="16" y="6" width="5" height="5" rx="1"/>
    <rect x="21" y="6" width="5" height="5" rx="1" fill-opacity=".3"/>
    <rect x="6" y="11" width="5" height="5" rx="1" fill-opacity=".55"/>
    <rect x="11" y="11" width="5" height="5" rx="1"/>
    <rect x="16" y="11" width="5" height="5" rx="1" fill-opacity=".3"/>
    <rect x="21" y="11" width="5" height="5" rx="1"/>
    <rect x="6" y="16" width="5" height="5" rx="1"/>
    <rect x="11" y="16" width="5" height="5" rx="1" fill-opacity=".3"/>
    <rect x="16" y="16" width="5" height="5" rx="1"/>
    <rect x="21" y="16" width="5" height="5" rx="1" fill-opacity=".55"/>
    <rect x="6" y="21" width="5" height="5" rx="1" fill-opacity=".3"/>
    <rect x="11" y="21" width="5" height="5" rx="1"/>
    <rect x="16" y="21" width="5" height="5" rx="1" fill-opacity=".55"/>
    <rect x="21" y="21" width="5" height="5" rx="1"/>
  </g>
</svg>
